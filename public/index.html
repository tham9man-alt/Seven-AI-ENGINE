
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>SEVEN AI ENGINE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #ffffff;
  background:
    radial-gradient(circle at top, #17264a, #090d18 65%);
  display: flex;
  justify-content: center;
  padding: 25px 15px;
}

.container {
  width: 100%;
  max-width: 650px;
}

.header {
  text-align: center;
  padding: 30px 10px;
}

.logo {
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #65caff;
  text-shadow: 0 0 25px #168bff66;
}

.subtitle {
  color: #aab8d2;
  margin-top: 12px;
  font-size: 16px;
}

.panel {
  background: #141d30;
  border: 1px solid #293957;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 15px 50px #0005;
}

h2 {
  font-size: 21px;
  margin-top: 0;
}

textarea {
  width: 100%;
  min-height: 135px;
  resize: vertical;
  background: #0b1323;
  border: 1px solid #344765;
  border-radius: 12px;
  padding: 16px;
  color: white;
  font-size: 16px;
  outline: none;
  line-height: 1.7;
}

textarea:focus {
  border-color: #45aaff;
}

select {
  width: 100%;
  padding: 13px;
  margin: 15px 0;
  background: #0b1323;
  color: white;
  border: 1px solid #344765;
  border-radius: 10px;
  font-size: 15px;
}

button {
  width: 100%;
  border: none;
  padding: 16px;
  border-radius: 12px;
  background: linear-gradient(110deg,#087cf0,#36c7ff);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

button:not(:disabled):active {
  transform: scale(.98);
}

.status {
  text-align: center;
  padding: 16px 5px;
  color: #8dcfff;
  line-height: 1.7;
}

.result {
  margin-top: 22px;
  display: none;
}

.result img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  background: #080d18;
  border-radius: 15px;
  border: 1px solid #344765;
}

.download {
  display: block;
  text-decoration: none;
  text-align: center;
  margin-top: 14px;
  padding: 14px;
  color: white;
  background: #167d55;
  border-radius: 10px;
}

.footer {
  text-align: center;
  color: #72829e;
  font-size: 12px;
  padding: 25px 0;
}
</style>
</head>

<body>

<main class="container">

<header class="header">
  <div class="logo">SEVEN AI ENGINE</div>
  <div class="subtitle">
    محركك الإبداعي لتوليد الصور بالذكاء الاصطناعي
  </div>
</header>

<section class="panel">

<h2>✨ مساحة الإبداع</h2>

<textarea
  id="prompt"
  placeholder="اكتب وصف الصورة التي تريد إنشاءها..."
></textarea>

<select id="size">
  <option value="1024x1024">مربع 1:1</option>
</select>

<button id="generate">
  إنشاء الصورة
</button>

<div class="status" id="status" aria-live="polite"></div>

<div class="result" id="result">
  <h2>🎨 الصورة الناتجة</h2>
  <img id="output" alt="الصورة الناتجة">
  <a id="download" class="download" download="seven-ai-image.png">
    تحميل الصورة
  </a>
</div>

</section>

<footer class="footer">
  SEVEN AI ENGINE © 2026
  <br>
  جميع الحقوق محفوظة
</footer>

</main>

<script>
const promptInput = document.getElementById("prompt");
const generateButton = document.getElementById("generate");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const output = document.getElementById("output");
const download = document.getElementById("download");

generateButton.addEventListener("click", generateImage);

async function generateImage() {
  const prompt = promptInput.value.trim();
  const size = document.getElementById("size").value;

  if (!prompt) {
    statusBox.textContent = "⚠️ اكتب وصف الصورة أولاً.";
    promptInput.focus();
    return;
  }

  generateButton.disabled = true;
  generateButton.textContent = "جارٍ إنشاء الصورة...";
  statusBox.textContent = "⏳ محرك SEVEN يعمل على إنشاء صورتك...";
  resultBox.style.display = "none";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: prompt,
        size: size
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message ||
        "حدث خطأ أثناء الاتصال بالمحرك.");
    }

    let imageUrl = data.image_url || data.url || data.image;

    if (!imageUrl && data.b64_json) {
      imageUrl = "data:image/png;base64," + data.b64_json;
    }

    if (!imageUrl && data.data && data.data[0]) {
      const item = data.data[0];

      if (item.b64_json) {
        imageUrl = "data:image/png;base64," + item.b64_json;
      } else if (item.url) {
        imageUrl = item.url;
      }
    }

    if (!imageUrl) {
      throw new Error("لم تصل الصورة من الخادم. تحقق من استجابة API.");
    }

    output.src = imageUrl;
    download.href = imageUrl;
    resultBox.style.display = "block";
    statusBox.textContent = "✅ تم إنشاء الصورة بنجاح!";

    resultBox.scrollIntoView({ behavior: "smooth" });

  } catch (error) {
    statusBox.textContent = "❌ " + error.message;
  } finally {
    generateButton.disabled = false;
    generateButton.textContent = "إنشاء الصورة";
  }
}
</script>

</body>
</html>
