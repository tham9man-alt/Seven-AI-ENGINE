<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="/style.css?v=3">
  <title>إعادة تعيين كلمة المرور | SEVEN AI ENGINE</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="mark">7</div>
      <div>
        <p class="eyebrow">استعادة الحساب</p>
        <h1>SEVEN <span>AI ENGINE</span></h1>
      </div>
    </header>
    <section class="panel">
      <h3>تعيين كلمة مرور جديدة</h3>
      <p class="form-help">اختر كلمة مرور جديدة لا تقل عن 10 أحرف.</p>
      <form id="reset-form">
        <label for="new-password">كلمة المرور الجديدة</label>
        <div class="password-wrap">
          <input id="new-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
          <button type="button" class="toggle-password" data-target="new-password" aria-label="إظهار كلمة المرور">إظهار</button>
        </div>
        <label for="confirm-password">تأكيد كلمة المرور</label>
        <div class="password-wrap">
          <input id="confirm-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
          <button type="button" class="toggle-password" data-target="confirm-password" aria-label="إظهار كلمة المرور">إظهار</button>
        </div>
        <button class="primary" type="submit">حفظ كلمة المرور الجديدة</button>
      </form>
      <p id="reset-status" class="status" aria-live="polite"></p>
      <p id="login-link" hidden><a href="/">العودة إلى تسجيل الدخول</a></p>
    </section>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
